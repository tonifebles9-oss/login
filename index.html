<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginApp - Frontend</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #5a6268; }
        #mensaje {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .user-list {
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 5px;
            background: #fafafa;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Portal de Acceso</h2>
    
    <div class="form-group">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" placeholder="ejemplo@correo.com">
    </div>
    
    <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" placeholder="********">
    </div>

    <button onclick="registrar()">Registrarse</button>
    <button onclick="login()" class="btn-secondary">Iniciar Sesión</button>
    <button onclick="obtenerUsuarios()" style="background-color: #28a745;">Ver Usuarios (GET)</button>

    <div id="mensaje"></div>

    <div class="user-list" id="listaUsuarios" style="display:none;">
        <strong>Usuarios Registrados:</strong>
        <ul id="ulUsuarios" style="padding-left: 20px; margin: 5px 0;"></ul>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:5237/api/auth';

    function mostrarMensaje(texto, esError = false) {
        const div = document.getElementById('mensaje');
        div.innerText = texto;
        div.className = esError ? 'error' : 'success';
        div.style.display = 'block';
    }

    async function registrar() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch(API_URL + '/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            });
            const data = await response.json();
            if (response.ok) {
                mostrarMensaje(data.message || '¡Registrado con éxito!');
            } else {
                mostrarMensaje(JSON.stringify(data), true);
            }
        } catch (error) {
            mostrarMensaje('Error de conexión con el servidor.', true);
        }
    }

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch(API_URL + '/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            });
            const data = await response.json();
            if (response.ok) {
                mostrarMensaje(data.message || '¡Inicio de sesión exitoso!');
            } else {
                mostrarMensaje(JSON.stringify(data), true);
            }
        } catch (error) {
            mostrarMensaje('Error de conexión con el servidor.', true);
        }
    }

    async function obtenerUsuarios() {
        try {
            const response = await fetch(API_URL + '/usuarios');
            const usuarios = await response.json();
            
            if (response.ok) {
                const ul = document.getElementById('ulUsuarios');
                ul.innerHTML = '';
                usuarios.forEach(function(u) {
                    const li = document.createElement('li');
                    li.innerText = 'ID: ' + u.id + ' - ' + u.email;
                    ul.appendChild(li);
                });
                document.getElementById('listaUsuarios').style.display = 'block';
                mostrarMensaje('Lista de usuarios cargada.');
            } else {
                mostrarMensaje('No se pudo obtener la lista.', true);
            }
        } catch (error) {
            mostrarMensaje('Error de conexión con el servidor.', true);
        }
    }
</script>

</body>
</html>
